<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 140"><title>Sabah</title><defs><radialGradient id="g"><stop offset="0" stop-color="#FFD27A" stop-opacity=".85"/><stop offset=".5" stop-color="#FFD27A" stop-opacity=".32"/><stop offset="1" stop-color="#FFD27A" stop-opacity="0"/></radialGradient><linearGradient id="s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFCF4A"/><stop offset="1" stop-color="#FF9F43"/></linearGradient></defs><style>.drift{animation:drift 10s ease-in-out infinite alternate}.drift2{animation:drift 14s ease-in-out infinite alternate-reverse}.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 6s ease-in-out infinite}.tw{animation:tw 3.2s ease-in-out infinite}.tw2{animation:tw 4.4s ease-in-out 1.1s infinite}.tw3{animation:tw 5s ease-in-out 2.3s infinite}@keyframes drift{from{transform:translateX(-5px)}to{transform:translateX(6px)}}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}@keyframes tw{0%,100%{opacity:.95}50%{opacity:.3}}@media (prefers-reduced-motion:reduce){.drift,.drift2,.pulse,.tw,.tw2,.tw3{animation:none}}</style>
