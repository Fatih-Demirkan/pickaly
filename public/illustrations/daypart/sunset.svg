<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 140"><title>Akşamüstü</title><defs><radialGradient id="g"><stop offset="0" stop-color="#FF9E6B" stop-opacity=".85"/><stop offset=".5" stop-color="#FF9E6B" stop-opacity=".32"/><stop offset="1" stop-color="#FF9E6B" stop-opacity="0"/></radialGradient><linearGradient id="s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFA552"/><stop offset="1" stop-color="#F2606A"/></linearGradient></defs><style>.drift{animation:drift 10s ease-in-out infinite alternate}.drift2{animation:drift 14s ease-in-out infinite alternate-reverse}.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 6s ease-in-out infinite}.tw{animation:tw 3.2s ease-in-out infinite}.tw2{animation:tw 4.4s ease-in-out 1.1s infinite}.tw3{animation:tw 5s ease-in-out 2.3s infinite}@keyframes drift{from{transform:translateX(-5px)}to{transform:translateX(6px)}}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}@keyframes tw{0%,100%{opacity:.95}50%{opacity:.3}}@media (prefers-reduced-motion:reduce){.drift,.drift2,.pulse,.tw,.tw2,.tw3{animation:none}}</style>
<circle class="pulse" cx="120" cy="92" r="62" fill="url(#g)"/>
<circle cx="120" cy="92" r="32" fill="url(#s)"/>
<g class="drift" opacity=".85" fill="#FFE6EC"><rect x="60" y="86" width="96" height="9" rx="4.5"/><rect x="92" y="104" width="92" height="9" rx="4.5"/></g>
<g class="drift2" opacity=".6" fill="#FFF3F5"><rect x="40" y="58" width="70" height="7" rx="3.5"/><rect x="140" y="70" width="48" height="7" rx="3.5"/></g>
<g class="drift"><g opacity="0.75" fill="#FFFFFF" transform="translate(18 100) scale(0.65)"><circle cx="14" cy="14" r="14"/><circle cx="34" cy="8" r="19"/><circle cx="56" cy="16" r="13"/><rect x="0" y="14" width="70" height="15" rx="7.5"/></g></g>
</svg>
